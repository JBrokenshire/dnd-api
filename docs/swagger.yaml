basePath: /
definitions:
  requests.CreateCharacterRequest:
    properties:
      advancement_type:
        description: Settings
        type: string
      charisma:
        maximum: 30
        minimum: 3
        type: integer
      class_id:
        type: integer
      constitution:
        maximum: 30
        minimum: 3
        type: integer
      dexterity:
        maximum: 30
        minimum: 3
        type: integer
      hit_point_type:
        type: string
      intelligence:
        maximum: 30
        minimum: 3
        type: integer
      level:
        maximum: 20
        minimum: 1
        type: integer
      name:
        maxLength: 200
        type: string
      pronouns:
        maxLength: 32
        type: string
      race_id:
        type: integer
      strength:
        description: Ability Scores
        maximum: 30
        minimum: 3
        type: integer
      wisdom:
        maximum: 30
        minimum: 3
        type: integer
    required:
    - advancement_type
    - charisma
    - class_id
    - constitution
    - dexterity
    - hit_point_type
    - intelligence
    - level
    - name
    - race_id
    - strength
    - wisdom
    type: object
  requests.CreateClassRequest:
    properties:
      hit_point_die_value:
        example: 4
        type: integer
      name:
        example: Barbarian
        maxLength: 200
        type: string
      primary_ability:
        example: Strength
        maxLength: 200
        type: string
      saves:
        example: '[''Strength'',''Constitution'']'
        maxLength: 200
        type: string
      short_description:
        example: Barbarians are mighty warriors who are powered by primal forces of
          the multiverse that manifest as a Rage.
        type: string
    required:
    - hit_point_die_value
    - name
    - primary_ability
    - saves
    - short_description
    type: object
  requests.CreateRaceRequest:
    properties:
      base_speed:
        example: 30
        type: integer
      creature_type:
        example: Humanoid
        maxLength: 200
        type: string
      name:
        example: Dragonborn
        maxLength: 200
        type: string
      short_description:
        example: The ancestors of dragonborn hatched from the eggs of chromatic and
          metallic dragons.
        type: string
      size:
        example: Medium (about 5-7 feet tall)
        maxLength: 200
        type: string
    required:
    - base_speed
    - creature_type
    - name
    - short_description
    - size
    type: object
  requests.CreateSubclassRequest:
    properties:
      class_id:
        type: integer
      name:
        maxLength: 200
        type: string
      short_description:
        type: string
    required:
    - class_id
    - name
    - short_description
    type: object
  requests.CreateUserRequest:
    properties:
      confirm_password:
        maxLength: 72
        type: string
      password:
        maxLength: 72
        type: string
      username:
        maxLength: 200
        type: string
    required:
    - confirm_password
    - password
    - username
    type: object
  requests.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  requests.UpdateCharacterHealthRequest:
    properties:
      current_hit_points:
        minimum: 0
        type: integer
    type: object
  requests.UpdateCharacterRequest:
    properties:
      advancement_type:
        description: Settings
        type: string
      charisma:
        maximum: 30
        minimum: 3
        type: integer
      class_id:
        type: integer
      constitution:
        maximum: 30
        minimum: 3
        type: integer
      dexterity:
        maximum: 30
        minimum: 3
        type: integer
      hit_point_type:
        type: string
      intelligence:
        maximum: 30
        minimum: 3
        type: integer
      level:
        maximum: 20
        minimum: 1
        type: integer
      name:
        maxLength: 200
        type: string
      pronouns:
        maxLength: 32
        type: string
      race_id:
        type: integer
      strength:
        description: Ability Scores
        maximum: 30
        minimum: 3
        type: integer
      wisdom:
        maximum: 30
        minimum: 3
        type: integer
    required:
    - advancement_type
    - charisma
    - class_id
    - constitution
    - dexterity
    - hit_point_type
    - intelligence
    - level
    - name
    - race_id
    - strength
    - wisdom
    type: object
  requests.UpdateClassRequest:
    properties:
      hit_point_die_value:
        example: 4
        type: integer
      name:
        example: Barbarian
        maxLength: 200
        type: string
      primary_ability:
        example: Strength
        maxLength: 200
        type: string
      saves:
        example: '[''Strength'',''Constitution'']'
        maxLength: 200
        type: string
      short_description:
        example: Barbarians are mighty warriors who are powered by primal forces of
          the multiverse that manifest as a Rage.
        type: string
    required:
    - hit_point_die_value
    - name
    - primary_ability
    - saves
    - short_description
    type: object
  requests.UpdateRaceRequest:
    properties:
      base_speed:
        example: 30
        type: integer
      creature_type:
        example: Humanoid
        maxLength: 200
        type: string
      name:
        example: Dragonborn
        maxLength: 200
        type: string
      short_description:
        example: The ancestors of dragonborn hatched from the eggs of chromatic and
          metallic dragons.
        type: string
      size:
        example: Medium (about 5-7 feet tall)
        maxLength: 200
        type: string
    required:
    - base_speed
    - creature_type
    - name
    - short_description
    - size
    type: object
  requests.UpdateSubclassRequest:
    properties:
      name:
        maxLength: 200
        type: string
      short_description:
        type: string
    required:
    - name
    - short_description
    type: object
  responses.CharacterPaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/responses.SlimCharacterResponse'
        type: array
      meta:
        $ref: '#/definitions/responses.ResponseMeta'
    type: object
  responses.CharacterResponse:
    properties:
      advancement_type:
        description: Settings
        type: string
      charisma:
        type: integer
      charisma_save_adjustment:
        type: integer
      class:
        $ref: '#/definitions/responses.ClassResponse'
      class_id:
        type: integer
      constitution:
        type: integer
      constitution_save_adjustment:
        type: integer
      current_hit_points:
        type: integer
      dexterity:
        type: integer
      dexterity_save_adjustment:
        type: integer
      hit_point_type:
        type: string
      id:
        type: integer
      inspiration:
        type: boolean
      intelligence:
        type: integer
      intelligence_save_adjustment:
        type: integer
      level:
        type: integer
      max_hit_points:
        type: integer
      name:
        type: string
      proficiencies:
        type: string
      profile_picture:
        $ref: '#/definitions/responses.FileResponse'
      pronouns:
        type: string
      race:
        $ref: '#/definitions/responses.RaceResponse'
      race_id:
        type: integer
      senses:
        type: string
      strength:
        description: Ability Scores
        type: integer
      strength_save_adjustment:
        description: Saving Throw Adjustments
        type: integer
      temp_hit_points:
        type: integer
      user_id:
        type: integer
      wisdom:
        type: integer
      wisdom_save_adjustment:
        type: integer
    type: object
  responses.ClassPaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/responses.ClassResponse'
        type: array
      meta:
        $ref: '#/definitions/responses.ResponseMeta'
    type: object
  responses.ClassResponse:
    properties:
      background_image:
        $ref: '#/definitions/responses.FileResponse'
      hit_point_die_value:
        type: integer
      id:
        type: integer
      logo:
        $ref: '#/definitions/responses.FileResponse'
      name:
        type: string
      primary_ability:
        type: string
      saves:
        type: string
      short_description:
        type: string
    type: object
  responses.Data:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  responses.Error:
    properties:
      code:
        type: integer
      error:
        type: string
    type: object
  responses.FileResponse:
    properties:
      created_at:
        type: string
      enterprise_uid:
        type: string
      file_location:
        type: string
      filename:
        type: string
      id:
        example: 1
        type: integer
      model:
        type: string
      model_id:
        type: integer
      updated_at:
        type: string
    type: object
  responses.LoginResponse:
    properties:
      accessToken:
        type: string
      authorised:
        type: boolean
      enabled:
        description: Does the user have 2FA enabled?
        type: boolean
      exp:
        type: integer
    type: object
  responses.LoginUserResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  responses.RacePaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/responses.RaceResponse'
        type: array
      meta:
        $ref: '#/definitions/responses.ResponseMeta'
    type: object
  responses.RaceResponse:
    properties:
      base_speed:
        type: integer
      creature_type:
        type: string
      id:
        type: integer
      logo:
        $ref: '#/definitions/responses.FileResponse'
      name:
        type: string
      short_description:
        type: string
      size:
        type: string
    type: object
  responses.RefreshResponse:
    properties:
      access_token:
        type: string
      exp:
        type: integer
      user_data:
        $ref: '#/definitions/responses.LoginUserResponse'
    type: object
  responses.ResponseMeta:
    properties:
      page:
        example: 3
        type: integer
      page_size:
        example: 25
        type: integer
      total_count:
        example: 300
        type: integer
    type: object
  responses.SlimCharacterResponse:
    properties:
      class:
        $ref: '#/definitions/responses.ClassResponse'
      class_id:
        type: integer
      id:
        type: integer
      level:
        type: integer
      name:
        type: string
      profile_picture:
        $ref: '#/definitions/responses.FileResponse'
      pronouns:
        type: string
      race:
        $ref: '#/definitions/responses.RaceResponse'
      race_id:
        type: integer
      user_id:
        type: integer
    type: object
  responses.SubclassPaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/responses.SubclassResponse'
        type: array
      meta:
        $ref: '#/definitions/responses.ResponseMeta'
    type: object
  responses.SubclassResponse:
    properties:
      class_id:
        type: integer
      id:
        type: integer
      logo:
        $ref: '#/definitions/responses.FileResponse'
      name:
        type: string
      short_description:
        type: string
    type: object
info:
  contact:
    email: jbrokenshire0306@gmail.com
    name: Jared Brokenshire
  description: A management solution for Dungeons & Dragons character sheet information
  title: D&D Character Dashboard
  version: 0.0.1
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Log a user in
      operationId: auth-login
      parameters:
      - description: User's credentials
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Error'
      summary: User Login
      tags:
      - Auth Actions
  /auth/logout:
    get:
      consumes:
      - application/json
      description: Set's the refresh cookie to an expired date and clears token.
      operationId: auth-logout
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Data'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Log User Out
      tags:
      - Auth Actions
  /auth/refresh:
    get:
      consumes:
      - application/json
      description: Perform refresh access token
      operationId: auth-refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Refresh access token
      tags:
      - Auth Actions
  /characters:
    get:
      consumes:
      - application/json
      description: List characters (paginated)
      operationId: characters-list
      parameters:
      - description: Search characters by name
        in: query
        name: search
        type: string
      - description: The page number
        in: query
        name: page
        type: integer
      - description: The numbers of items to return. Max 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.CharacterPaginatedResponse'
      summary: List characters
      tags:
      - Character Actions
    post:
      consumes:
      - application/json
      description: Create character
      operationId: characters-create
      parameters:
      - description: Character information
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/requests.CreateCharacterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.CharacterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Create character
      tags:
      - Character Actions
  /characters/{id}:
    delete:
      consumes:
      - application/json
      description: Delete character
      operationId: characters-delete
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Data'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Delete character
      tags:
      - Character Actions
    get:
      consumes:
      - application/json
      description: Get character by ID
      operationId: characters-get
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.CharacterResponse'
      summary: Get character by ID
      tags:
      - Character Actions
    put:
      consumes:
      - application/json
      description: Update character
      operationId: characters-update
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      - description: Character information
        in: body
        name: params
        required: true
        schema:
